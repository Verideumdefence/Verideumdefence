services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ciphera
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ciphera}
      POSTGRES_DB: ciphera
    ports:
      - "5432:5432"
    volumes:
      - verideumdefence-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ciphera"]
      interval: 5s
      retries: 10

  api:
    build: .
    environment:
      VERIDEUMDEFENCE_DATABASE_URL: postgresql+psycopg2://ciphera:${POSTGRES_PASSWORD:-ciphera}@db:5432/ciphera
      VERIDEUMDEFENCE_SECRET_KEY: ${VERIDEUMDEFENCE_SECRET_KEY:-${CIPHERA_SECRET_KEY:-local-development-secret-change-before-deployment}}
      VERIDEUMDEFENCE_ZAP_API_URL: http://zap:8080
      VERIDEUMDEFENCE_ZAP_API_KEY: ${ZAP_API_KEY:-verideumdefence-local-zap-key}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      zap:
        condition: service_started

  zap:
    image: zaproxy/zap-stable:latest
    command: ["zap.sh", "-daemon", "-host", "0.0.0.0", "-port", "8080", "-config", "api.key=${ZAP_API_KEY:-verideumdefence-local-zap-key}", "-config", "api.addrs.addr.name=.*", "-config", "api.addrs.addr.regex=true"]
    networks:
      - default

volumes:
  verideumdefence-db:
    name: ciphera-cybersecurity-source_ciphera-db
