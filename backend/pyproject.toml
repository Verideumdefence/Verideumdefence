[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# FastAPI's dependency injection relies on call expressions in argument defaults.
ignore = ["B008"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
plugins = []

[tool.pytest.ini_options]
testpaths = ["tests"]
